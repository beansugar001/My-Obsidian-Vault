<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <rect width="1200" height="720" fill="#f7f9fc"/>
  <text x="600" y="54" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="32" font-weight="700" fill="#14213d">CY63300 测试板 U5 JTAG 接线图</text>
  <text x="600" y="91" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#4b5563">PCB 元件面俯视，方向与实物照片一致；方形焊盘为 1 脚</text>

  <rect x="60" y="150" width="275" height="415" rx="18" fill="#ffffff" stroke="#2563eb" stroke-width="4"/>
  <text x="197" y="195" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#1d4ed8">CMSIS-DAPLink</text>
  <text x="197" y="230" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#374151">正确调试器</text>
  <g font-family="Consolas, Microsoft YaHei, sans-serif" font-size="19" fill="#111827">
    <text x="92" y="285">VTref / VCC → U5-7</text>
    <text x="92" y="330">GND → U5-10</text>
    <text x="92" y="375">TCK → U5-1</text>
    <text x="92" y="420">TMS → U5-3</text>
    <text x="92" y="465">TDI → U5-5</text>
    <text x="92" y="510">TDO → U5-2</text>
    <text x="92" y="555">nRESET → U5-8</text>
  </g>

  <text x="790" y="145" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="700" fill="#111827">测试板 U5 自定义 2×5 接口</text>
  <rect x="540" y="175" width="500" height="255" rx="12" fill="#1f2937"/>
  <g font-family="Consolas, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" text-anchor="middle">
    <g fill="#fbbf24" stroke="#fef3c7" stroke-width="3">
      <circle cx="590" cy="245" r="34"/><circle cx="690" cy="245" r="34"/><circle cx="790" cy="245" r="34"/><circle cx="890" cy="245" r="34"/>
      <rect x="956" y="211" width="68" height="68" rx="5"/>
      <circle cx="590" cy="355" r="34"/><circle cx="690" cy="355" r="34"/><circle cx="790" cy="355" r="34"/><circle cx="890" cy="355" r="34"/><circle cx="990" cy="355" r="34"/>
    </g>
    <g fill="#111827">
      <text x="590" y="239">9</text><text x="590" y="262" font-size="15">NC</text>
      <text x="690" y="239">7</text><text x="690" y="262" font-size="15">VREF</text>
      <text x="790" y="239">5</text><text x="790" y="262" font-size="15">TDI</text>
      <text x="890" y="239">3</text><text x="890" y="262" font-size="15">TMS</text>
      <text x="990" y="239">1</text><text x="990" y="262" font-size="15">TCK</text>
      <text x="590" y="349">10</text><text x="590" y="372" font-size="15">GND</text>
      <text x="690" y="349">8</text><text x="690" y="372" font-size="15">RST</text>
      <text x="790" y="349">6</text><text x="790" y="372" font-size="15">GND</text>
      <text x="890" y="349">4</text><text x="890" y="372" font-size="15">NC</text>
      <text x="990" y="349">2</text><text x="990" y="372" font-size="15">TDO</text>
    </g>
  </g>

  <rect x="530" y="495" width="530" height="115" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
  <text x="795" y="535" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#9a3412">板子先用 USB-C 供电</text>
  <text x="795" y="570" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#7c2d12">U5-7 只作为约 3.3 V 目标电压参考，不要接调试器 5 V 输出</text>

  <text x="600" y="665" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#b91c1c">普通 ST-Link：当前 RISC-V 工程不要使用；标准 ARM 10Pin 排线也不能直接整排插入 U5</text>
</svg>
